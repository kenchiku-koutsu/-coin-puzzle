<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>コインの不思議｜16枚を裏返すだけ</title><style>body{font-family:system-ui,sans-serif;background:#f5f7fb;color:#182438;margin:0;padding:20px}main{max-width:650px;margin:auto}section{background:white;border-radius:18px;padding:20px;margin:16px 0;box-shadow:0 3px 16px #14233a12}h1{font-size:1.6rem}p{line-height:1.7}.coins{display:grid;grid-template-columns:repeat(8,1fr);gap:7px}.coin{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;background:#dce4ee}.heads{background:#f2c767}.numbers{display:flex;justify-content:space-between;gap:10px}.numbers>div{flex:1;background:#eef5ff;border-radius:12px;padding:12px;text-align:center}.big{font-size:2rem;font-weight:800}input{width:100%;accent-color:#2364d2}button{background:#2364d2;color:white;border:0;border-radius:12px;padding:14px 20px;font-weight:700;width:100%;font-size:1rem}button:focus-visible{outline:3px solid orange}.success{color:#087d54;font-weight:800}small{color:#526174}</style></head><body><main><h1>🪙 コインの不思議</h1><p>200枚のコインに表が16枚。目隠しをしたまま、2組の「表の枚数」を同じにできる？</p><section><h2>① 適当に16枚取る</h2><p>取り出した16枚のうち、表が何枚だったかを動かしてみよう。</p><label for="range">取り出した16枚の表：<strong id="count">5</strong>枚</label><input id="range" type="range" min="0" max="16" value="5"><div id="coins" class="coins" aria-label="取り出した16枚のコイン"></div><p id="before"></p></section><section><h2>② 16枚を全部裏返す</h2><button id="flip">16枚を裏返す！</button><div class="numbers"><div>取り出した16枚<br><span id="left" class="big">5</span><br>表の枚数</div><div>残り184枚<br><span id="right" class="big">11</span><br>表の枚数</div></div><p id="result" role="status"></p></section><section><h2>なぜ必ず一致する？</h2><p>取り出した16枚の<strong>裏の枚数</strong>は、残り184枚の<strong>表の枚数</strong>と必ず同じ。だから16枚を全部裏返せば、表の枚数が一致するんです。</p><small>これは「表の総数が16枚」と最初からわかっていることがポイントです。</small></section></main><script>const range=document.getElementById('range'),coins=document.getElementById('coins'),flip=document.getElementById('flip');let flipped=false;function render(){const h=Number(range.value),a=flipped?16-h:h,b=16-h;document.getElementById('count').textContent=h;coins.innerHTML=Array.from({length:16},(_,i)=>`<span class="coin ${i<a?'heads':''}">${i<a?'表':'裏'}</span>`).join('');document.getElementById('before').textContent=`取り出した16枚：表${h}枚・裏${16-h}枚。残り184枚：表${b}枚。`;document.getElementById('left').textContent=a;document.getElementById('right').textContent=b;document.getElementById('result').innerHTML=flipped?'<span class="success">✓ 表の枚数が一致しました！</span>':'まだ一致しなくても大丈夫。裏返してみよう。';flip.textContent=flipped?'元に戻す':'16枚を裏返す！'}range.addEventListener('input',()=>{flipped=false;render()});flip.addEventListener('click',()=>{flipped=!flipped;render()});render();</script></body></html>
