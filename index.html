<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#172a4a"><title>コインの不思議｜触ってわかる思考クイズ</title>
<style>
:root{font-family:system-ui,-apple-system,'Noto Sans JP',sans-serif;color:#18263b;background:#f2f5fa}*{box-sizing:border-box}body{margin:0}main{max-width:740px;margin:auto;padding:20px 14px 50px}h1{font-size:clamp(1.6rem,5vw,2.2rem);margin:8px 0}h2{font-size:1.2rem;margin:0 0 12px}p{line-height:1.75}.eyebrow{color:#45618b;font-weight:700}.card{background:white;border-radius:18px;padding:20px;margin:16px 0;box-shadow:0 4px 18px #14233a12}.intro{background:#172a4a;color:white}.intro .eyebrow{color:#bdd7ff}.intro p{margin-bottom:0}.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.choice{padding:12px 6px;border:2px solid #d7e0ee;background:#fff;color:#1a3458;border-radius:12px;font-size:.93rem;font-weight:700;cursor:pointer}.choice.active{border-color:#1767d1;background:#e8f2ff}.primary,.secondary{width:100%;padding:14px;border-radius:12px;border:0;font-size:1rem;font-weight:800;cursor:pointer}.primary{background:#1767d1;color:white}.secondary{background:#e9eff7;color:#1a3458}button:focus-visible,input:focus-visible{outline:3px solid #ffad32;outline-offset:2px}.muted{color:#50627b}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.stat{background:#edf4ff;padding:14px 8px;border-radius:12px;text-align:center}.stat b{display:block;font-size:2rem;color:#174a9b}.coins{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;margin:14px 0}.coin{aspect-ratio:1;display:grid;place-items:center;border-radius:50%;font-size:clamp(.65rem,2.7vw,.92rem);font-weight:800;background:#d9e0eb;border:2px solid #a8b4c7}.coin.head{background:#f5cf6a;border-color:#c4942b;color:#563e0c}.slider{width:100%;accent-color:#1767d1;margin:18px 0}.hint{padding:14px;background:#fff8e4;border-left:4px solid #e2ad32;border-radius:8px}.result{font-weight:700;min-height:2em}.success{color:#08744c}.foot{font-size:.85rem;color:#58697e}@media(max-width:390px){.card{padding:16px}.choice{font-size:.8rem}}
</style></head><body><main>
<section class="card intro"><div class="eyebrow">触ってわかる思考クイズ</div><h1>🪙 コインの不思議</h1><p id="question"></p></section>
<section class="card"><h2>① 問題を選ぼう</h2><div class="choices" role="group" aria-label="問題を選択"><button class="choice active" data-total="100" data-heads="10" aria-pressed="true">100枚<br>表10枚</button><button class="choice" data-total="200" data-heads="16" aria-pressed="false">200枚<br>表16枚</button><button class="choice" data-total="50" data-heads="5" aria-pressed="false">50枚<br>表5枚</button></div><p class="muted">目隠しをしたままコインを2組に分け、両方の組の「表の枚数」を同じにできるでしょうか？</p><button class="secondary" id="hintBtn" aria-expanded="false">ヒントを見る</button><p id="hint" class="hint" hidden>表のコインを探す必要はありません。最初にわかっている「表の総数」と同じ枚数だけ取り出してみましょう。</p></section>
<section class="card"><h2>② コインを取り出して実験</h2><p id="instruction"></p><label for="range">取り出したコインに含まれる表：<strong id="count">0</strong>枚</label><input class="slider" id="range" type="range" min="0" max="10" value="3"><div class="coins" id="coins" aria-label="取り出したコインの状態"></div><p class="muted" id="before"></p></section>
<section class="card"><h2>③ 取り出したコインを全部裏返す</h2><button class="primary" id="flip">全部裏返してみる！</button><div class="stats"><div class="stat">取り出した組<b id="left">0</b><small>表の枚数</small></div><div class="stat">残りの組<b id="right">0</b><small>表の枚数</small></div></div><p id="result" class="result" role="status"></p></section>
<section class="card"><h2>なぜ必ず同じになる？</h2><p id="explanation"></p><p>目隠しをしていても、どのコインが表かを知る必要はありません。<strong>取り出した組を全部裏返す</strong>ことが答えです。</p><button class="secondary" id="reset">もう一度試す</button></section>
<p class="foot">操作はすべてこのページ内で完結します。登録や個人情報の入力は不要です。</p></main>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id);let total=100,heads=10,flipped=false;const range=$('range');function render(){const n=Number(range.value),remaining=heads-n,picked=flipped?heads-n:n;$('question').textContent=`${total}枚のコインのうち、表は${heads}枚。目隠ししたまま2組の表の枚数を同じにする方法は？`;$('instruction').textContent=`どれが表かわからないまま、${heads}枚を適当に取り出します。取り出した${heads}枚の表の数をスライダーで変えてみましょう。`;$('count').textContent=n;$('coins').innerHTML=Array.from({length:heads},(_,i)=>`<span class="coin ${i<picked?'head':''}">${i<picked?'表':'裏'}</span>`).join('');$('before').textContent=`裏返す前：取り出した${heads}枚は表${n}枚・裏${heads-n}枚。残り${total-heads}枚には表${remaining}枚。`;$('left').textContent=picked;$('right').textContent=remaining;$('flip').textContent=flipped?'元に戻す':'全部裏返してみる！';$('result').textContent=flipped?`成功！ 両方とも表が${remaining}枚になりました。`:'今は表の枚数が違っていても大丈夫。ボタンを押してみよう。';$('result').className='result'+(flipped?' success':'');$('explanation').textContent=`取り出した${heads}枚に表が${n}枚あるとすると、裏は${heads-n}枚。残りの組には表が${heads-n}枚あります。取り出した組をすべて裏返すと、元の裏${heads-n}枚が表になるので、必ず一致します。`}
function setProblem(t,h){total=t;heads=h;flipped=false;range.max=String(h);range.value=String(Math.floor(h/3));document.querySelectorAll('.choice').forEach(b=>{const selected=Number(b.dataset.total)===t;b.classList.toggle('active',selected);b.setAttribute('aria-pressed',String(selected))});render()}
document.querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>setProblem(Number(b.dataset.total),Number(b.dataset.heads))));range.addEventListener('input',()=>{flipped=false;render()});$('flip').addEventListener('click',()=>{flipped=!flipped;render()});$('reset').addEventListener('click',()=>{flipped=false;range.value=String(Math.floor(heads/3));render();$('range').focus()});$('hintBtn').addEventListener('click',()=>{const show=$('hint').hidden;$('hint').hidden=!show;$('hintBtn').textContent=show?'ヒントを閉じる':'ヒントを見る';$('hintBtn').setAttribute('aria-expanded',String(show))});setProblem(100,10)})();
</script></body></html>
